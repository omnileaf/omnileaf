config:
  validation: true
  warningsAsErrors: true

style:
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    excludeGuardClauses: true
  ForbiddenImport:
    active: true
    imports:
      - value: 'android.util.Log'
        reason: 'Log through PrivateLog or FolderAccessLog, which take only fixed events and reasons.'
      - value: 'app.tauri.Logger'
        reason: 'Log through PrivateLog or FolderAccessLog, which take only fixed events and reasons.'
    excludes: ['**/PrivateLog.kt', '**/FolderAccessLog.kt', '**/generated/**']
