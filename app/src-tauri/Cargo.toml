[package]
name = "omnileaf-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "omnileaf_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
getrandom.workspace = true
omnileaf-edge-swipe.workspace = true
omnileaf-engine.workspace = true
omnileaf-icon-actions.workspace = true
omnileaf-relay-proto.workspace = true
os_info.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-wdio-webdriver = { workspace = true, optional = true }
tauri-specta.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
webpki-roots.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
omnileaf-folder-access.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
omnileaf-system-bars.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2-foundation.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { workspace = true, features = ["image-png", "tray-icon"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-single-instance.workspace = true
trash.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk.workspace = true
webkit2gtk.workspace = true
zbus.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { workspace = true, features = ["async-io", "p2p"] }

[target.'cfg(windows)'.dependencies]
omnileaf-windows-probes.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
axum.workspace = true
omnileaf-db.workspace = true
omnileaf-formats.workspace = true
omnileaf-relay.workspace = true
omnileaf-system-bars.workspace = true
omnileaf-testkit.workspace = true
serde_json.workspace = true
tauri = { workspace = true, features = ["test"] }
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
