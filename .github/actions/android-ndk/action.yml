name: Install the Android NDK
description: Installs the pinned Android NDK through the SDK manager and points NDK_HOME at it.

runs:
  using: composite
  steps:
    - name: Install the Android NDK
      shell: bash
      env:
        NDK_VERSION: 27.1.12297006
      run: |
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
        echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
