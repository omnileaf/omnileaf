name: Install the Android NDK
description: Points NDK_HOME at the Android NDK pinned in .android-ndk-version, installing it through the SDK manager only when the runner lacks it.

runs:
  using: composite
  steps:
    - name: Install the Android NDK
      shell: bash
      run: |
        ndk_version="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/.android-ndk-version")"
        ndk="$ANDROID_HOME/ndk/$ndk_version"
        if [[ -f "$ndk/source.properties" ]] && grep -qxF "Pkg.Revision = $ndk_version" "$ndk/source.properties"; then
          echo "Using NDK $ndk_version from the runner image"
        else
          echo "Installing NDK $ndk_version"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk_version" > /dev/null
        fi
        echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
