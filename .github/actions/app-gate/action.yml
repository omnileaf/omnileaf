name: Build and test the app
description: Sets up the interface and Rust tools on the checked-out repository, then builds the desktop app and runs its tests where the platform can.

runs:
  using: composite
  steps:
    - name: Install WebKitGTK and a virtual display
      if: runner.os == 'Linux'
      uses: ./.github/actions/apt-packages
      with:
        packages: libwebkit2gtk-4.1-dev xvfb

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: pnpm

    - name: Install interface dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Install the pinned toolchain
      shell: bash
      run: rustup toolchain install

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        save-if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}

    - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
      with:
        tool: cargo-nextest@0.9.146,cargo-deny@0.20.2,cargo-about@0.9.2

    - name: Check the development tools
      shell: bash
      run: cargo xtask doctor

    - name: Build and test the app
      if: runner.os == 'Linux'
      shell: bash
      run: xvfb-run --auto-servernum cargo xtask check --only app

    - name: Build and test the app
      if: runner.os != 'Linux'
      shell: bash
      run: cargo xtask check --only app
