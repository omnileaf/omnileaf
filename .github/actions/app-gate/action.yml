name: Build and test the app
description: Sets up the interface and Rust tools on the checked-out repository, then builds the desktop app and runs its tests where the platform can.

runs:
  using: composite
  steps:
    - name: Install WebKitGTK and a virtual display
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev xvfb

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        cache: pnpm

    - name: Install interface dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Install the pinned toolchain
      shell: bash
      run: rustup toolchain install

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
      with:
        tool: cargo-nextest@0.9.146,cargo-deny@0.20.2,cargo-about@0.9.2

    - name: Check the development tools
      shell: bash
      run: cargo xtask doctor

    - name: Build and test the app
      if: runner.os == 'Linux'
      shell: bash
      run: xvfb-run --auto-servernum cargo xtask check --only app

    - name: Build and test the app
      if: runner.os == 'macOS'
      shell: bash
      run: cargo xtask check --only app

    - name: Build the app
      if: runner.os == 'Windows'
      shell: bash
      run: pnpm --dir app tauri build --debug --no-bundle
