name: Run the Rust gate
description: Sets up the pinned toolchain and test runner on the checked-out repository and runs the platform-dependent Rust checks.

inputs:
  budget-slack:
    description: The OMNILEAF_BUDGET_SLACK to allow for stalls on shared runners; none when empty.
    required: false
    default: ""
  check-args:
    description: The `cargo xtask check` arguments that narrow the gate to one part of it; the whole gate when empty.
    required: false
    default: ""
  cache-key:
    description: The build cache to keep apart for a part of the gate that builds something the other parts don't; the job's own cache when empty.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install WebKitGTK
      if: runner.os == 'Linux'
      uses: ./.github/actions/apt-packages
      with:
        packages: libwebkit2gtk-4.1-dev

    - name: Install the pinned toolchain
      shell: bash
      run: rustup toolchain install

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: ${{ inputs.cache-key }}
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
      with:
        tool: cargo-nextest@0.9.146

    - name: Keep the antivirus from scanning the scratch and build folders the timings write to
      if: runner.os == 'Windows'
      shell: pwsh
      run: Add-MpPreference -ExclusionPath $env:TEMP, $env:RUNNER_TEMP, $env:GITHUB_WORKSPACE

    - name: Allow for stalls on shared runners in the timing budgets
      if: inputs.budget-slack != ''
      shell: bash
      env:
        BUDGET_SLACK: ${{ inputs.budget-slack }}
      run: echo "OMNILEAF_BUDGET_SLACK=$BUDGET_SLACK" >> "$GITHUB_ENV"

    - name: Run the gate
      shell: bash
      env:
        CHECK_ARGS: ${{ inputs.check-args }}
      run: cargo xtask check --only rust $CHECK_ARGS
