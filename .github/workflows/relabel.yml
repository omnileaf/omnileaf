name: relabel

on:
  pull_request:
    types: [labeled, unlabeled]

permissions: {}

jobs:
  rerun:
    name: re-run ci for a label change
    if: ${{ contains(fromJSON('["no-changelog","macos","mobile"]'), github.event.label.name) && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Re-run the pull request's newest ci run so it reads the labels again
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          run_field() { gh run view "$run" --json "$1" --jq ".$1"; }
          wait_until_completed() {
            for _ in $(seq 60); do
              status=$(run_field status)
              if [ "$status" = completed ]; then return 0; fi
              sleep 5
            done
            echo "::error::ci run $run did not stop within five minutes of being cancelled"
            return 1
          }

          head=$(gh pr view "$PULL_REQUEST" --json headRefOid --jq .headRefOid)
          run=$(gh run list --workflow ci.yml --event pull_request --commit "$head" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run" ]; then exit 0; fi

          seen=$(run_field attempt)
          status=$(run_field status)
          if [ "$status" != completed ]; then
            labels_read=$(gh run view "$run" --json jobs --jq 'any(.jobs[]; .name == "changed areas" and (.status == "in_progress" or .status == "completed"))')
            if [ "$labels_read" = false ]; then exit 0; fi
            gh run cancel "$run" || [ "$(run_field status)" = completed ]
            wait_until_completed
          fi

          attempt=$(run_field attempt)
          if [ "$attempt" -gt "$seen" ]; then exit 0; fi
          if ! gh run rerun "$run"; then
            attempt=$(run_field attempt)
            status=$(run_field status)
            [ "$attempt" -gt "$seen" ] || [ "$status" != completed ]
          fi
