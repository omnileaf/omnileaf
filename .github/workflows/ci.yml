name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "0 17 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -sSfL --retry 3 --max-time 120 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'

  rust:
    name: rust gate (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: macos
            runner: macos-15
            budget-slack: 2
          - platform: windows
            runner: windows-2025
            budget-slack: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-nextest@0.9.146

      - name: Allow for stalls on shared runners in the timing budgets
        if: matrix.budget-slack
        shell: bash
        env:
          BUDGET_SLACK: ${{ matrix.budget-slack }}
        run: echo "OMNILEAF_BUDGET_SLACK=$BUDGET_SLACK" >> "$GITHUB_ENV"

      - name: Run the gate
        run: cargo xtask check --only rust

  portable:
    name: portable gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2

      - name: Run the gate
        run: cargo xtask check --only portable

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CORE_LINE_COVERAGE_FLOOR: 76
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install WebKitGTK
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev

      - name: Install the pinned toolchain with the LLVM tools
        run: rustup toolchain install && rustup component add llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-nextest@0.9.146,cargo-llvm-cov@0.9.1

      - name: Measure the tests' coverage
        run: cargo llvm-cov nextest --workspace --all-features --locked --no-report

      - name: Report coverage
        run: |
          {
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hold the core crates to their coverage floor
        run: cargo llvm-cov report --summary-only --ignore-filename-regex '(^|/)(app|xtask)/' --fail-under-lines "$CORE_LINE_COVERAGE_FLOOR"

  fixtures:
    name: fixtures (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: macos
            runner: macos-15
          - platform: windows
            runner: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: xtask
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Generate the fixtures twice and hash them
        run: |
          for run in first second; do
            cargo xtask fixtures --out "target/fixtures-$run"
            (cd "target/fixtures-$run" && find . -type f | LC_ALL=C sort | while IFS= read -r file; do
              printf '%s  %s\n' "$(git hash-object --no-filters "$file")" "$file"
            done) > "target/fixtures-$run.hashes"
          done
          diff target/fixtures-first.hashes target/fixtures-second.hashes
          cp target/fixtures-first.hashes "fixtures-${{ matrix.platform }}.hashes"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixtures-${{ matrix.platform }}
          path: fixtures-${{ matrix.platform }}.hashes
          if-no-files-found: error
          retention-days: 3

      - name: Keep the generated fixtures for comparing platforms
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixture-files-${{ matrix.platform }}
          path: target/fixtures-first/
          if-no-files-found: error
          retention-days: 3

  fixtures-agree:
    name: fixtures agree across platforms
    needs: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fixtures-*
          merge-multiple: true

      - name: Compare the fixture hashes
        run: |
          status=0
          diff fixtures-linux.hashes fixtures-macos.hashes || status=1
          diff fixtures-linux.hashes fixtures-windows.hashes || status=1
          exit "$status"

  interface:
    name: interface gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install interface dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the test browser
        uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: xtask
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run the gate
        run: cargo xtask check --only interface

  browser:
    name: browser tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      PLAYWRIGHT_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install interface dependencies
        run: pnpm install --frozen-lockfile

      - name: Name the test browsers' system packages
        id: browser-packages
        run: |
          playwright=$(pnpm --dir app exec playwright --version)
          digest=$(printf '%s %s %s' "$ImageOS" "$ImageVersion" "$playwright" | sha256sum | cut -c1-16)
          echo "key=playwright-system-packages-$digest" >> "$GITHUB_OUTPUT"

      - name: Restore the test browsers' system packages
        id: restore-browser-packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/browser-packages
          key: ${{ steps.browser-packages.outputs.key }}

      - name: Put the test browsers' system packages back
        run: |
          if compgen -G "$HOME/browser-packages/*.deb" > /dev/null; then
            sudo cp "$HOME"/browser-packages/*.deb /var/cache/apt/archives/
          fi

      - name: Install the test browsers
        uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium webkit

      - name: Collect the system packages the install downloaded
        run: |
          mkdir -p "$HOME/browser-packages"
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t "$HOME/browser-packages" {} +
          echo "Kept $(find "$HOME/browser-packages" -name '*.deb' | wc -l) system packages for the next run"

      - name: Keep the test browsers' system packages for later runs
        if: github.ref == 'refs/heads/main' && matrix.shard == 1 && steps.restore-browser-packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/browser-packages
          key: ${{ steps.browser-packages.outputs.key }}

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: xtask
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run the browser tests
        run: cargo xtask check --only browser

      - name: Time the interface on its own
        if: matrix.shard == strategy.job-total
        run: env -u PLAYWRIGHT_SHARD pnpm --dir app test:e2e --project speed --no-deps

      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-traces-${{ matrix.shard }}
          path: app/test-results/
          retention-days: 7

  android:
    name: android
    if: github.event_name == 'push' || github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'mobile')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: 27.1.12297006
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install the Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install interface dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the pinned toolchain with the emulator's Android target
        run: rustup toolchain install && rustup target add x86_64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Appium
        run: npm install --global appium@3.8.0 && appium driver install uiautomator2@8.7.0

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build and test the app on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          script: cargo xtask check --only android

      - name: Keep the Appium log of failed tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-appium-log
          path: app/test-results/
          retention-days: 7

  ios:
    name: ios
    if: github.event_name == 'push' || github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'mobile')
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install interface dependencies
        run: pnpm install --frozen-lockfile

      - name: Start booting an iPhone Simulator matching Xcode's SDK
        run: |
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          runtime=$(xcrun simctl list runtimes --json | jq -r --arg sdk "$sdk" 'first(.runtimes[] | select(.platform == "iOS" and .isAvailable and .version == $sdk)) | .identifier')
          udid=$(xcrun simctl list devices available --json | jq -r --arg runtime "$runtime" '.devices[$runtime] | map(select(.name | startswith("iPhone"))) | first | .udid')
          nohup xcrun simctl boot "$udid" > "$RUNNER_TEMP/simulator-boot.log" 2>&1 &
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Install the pinned toolchain with the iOS targets
        run: rustup toolchain install && rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Appium
        run: npm install --global appium@3.8.0 && appium driver install xcuitest@12.13.2

      - name: Download the prebuilt WebDriverAgent for the Simulator
        run: |
          appium driver run xcuitest download-wda -- --outdir "$RUNNER_TEMP/wda" --platform iOS --kind sim
          wda=$(find "$RUNNER_TEMP/wda" -maxdepth 6 -name WebDriverAgentRunner-Runner.app | head -n 1)
          test -n "$wda"
          echo "OMNILEAF_PREBUILT_WDA=$wda" >> "$GITHUB_ENV"

      - name: Wait for the Simulator to finish booting
        run: xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Build and test the app on the Simulator
        run: cargo xtask check --only ios

      - name: Keep the Appium log of failed tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-appium-log
          path: app/test-results/
          retention-days: 7

  app:
    name: app (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: macos
            runner: macos-15
          - platform: windows
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install WebKitGTK and a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev xvfb

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install interface dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-nextest@0.9.146,cargo-deny@0.20.2,cargo-about@0.9.2

      - name: Check the development tools
        run: cargo xtask doctor

      - name: Build and test the app
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum cargo xtask check --only app

      - name: Build and test the app
        if: runner.os == 'macOS'
        run: cargo xtask check --only app

      - name: Build the app
        if: runner.os == 'Windows'
        run: pnpm --dir app tauri build --debug --no-bundle

  prune-caches:
    name: prune caches
    needs: [rust, portable, coverage, fixtures, interface, browser, android, ios, app]
    if: always() && (github.event_name == 'push' || github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Keep the newest cache of each kind saved from main
        run: |
          gh api --paginate "repos/$GH_REPO/actions/caches?per_page=100" --jq '.actions_caches[]' \
            | jq -s -r '
                [.[] | .family = (.key | sub("-[0-9a-f]{8,}$"; ""))]
                | (map(select(.ref != "refs/heads/main")) | map(.id))
                  + (map(select(.ref == "refs/heads/main"))
                     | group_by(.family)
                     | map(sort_by(.created_at) | reverse | .[1:] | map(.id))
                     | add // [])
                | .[]' \
            | while read -r id; do
                gh api -X DELETE "repos/$GH_REPO/actions/caches/$id" --silent && echo "Deleted cache $id"
              done
          gh api "repos/$GH_REPO/actions/cache/usage" --jq '"Caches now hold \(.active_caches_size_in_bytes / 1048576 | floor) MB"'
