name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "0 17 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  changes:
    name: changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.merge_group.base_sha }}
    outputs:
      native: ${{ steps.areas.outputs.native }}
      app: ${{ steps.areas.outputs.app }}
      site: ${{ steps.areas.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Fetch the commit the merge queue starts from
        if: github.event_name == 'merge_group'
        run: git fetch --no-tags --depth=1 origin "$BASE"

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: xtask
          save-if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}

      - name: Find the areas the change touches
        id: areas
        run: |
          areas=$(cargo xtask changes ${BASE:+--base "$BASE"})
          echo "$areas" | tee -a "$GITHUB_OUTPUT"

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -sSfL --retry 3 --max-time 120 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'

  rust:
    name: rust gate (linux)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - if: needs.changes.outputs.native != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: needs.changes.outputs.native != 'false'
        uses: ./.github/actions/rust-gate

  rust-windows:
    name: rust gate (windows ${{ matrix.part }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.native != 'false' && (github.event_name != 'pull_request' || github.base_ref == 'main') }}
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: lint, cache: lint, check: --step lint }
          - { part: tests 1/3, cache: tests, check: --step test --partition hash:1/3 }
          - { part: tests 2/3, cache: tests, check: --step test --partition hash:2/3 }
          - { part: tests 3/3, cache: tests, check: --step test --partition hash:3/3 }
          - { part: budgets, cache: budgets, check: --skip lint --skip test }
    steps:
      - if: needs.changes.outputs.native != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: needs.changes.outputs.native != 'false'
        uses: ./.github/actions/rust-gate
        with:
          budget-slack: 2
          cache-key: ${{ matrix.cache }}
          check-args: ${{ matrix.check }}

  rust-windows-gate:
    name: rust gate (windows)
    needs: rust-windows
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Pass only when every part passed, or none were needed
        env:
          PARTS: ${{ needs.rust-windows.result }}
        run: test "$PARTS" = success || test "$PARTS" = skipped

  rust-macos:
    name: rust gate (macos)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.native != 'false' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'macos')) }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-gate
        with:
          budget-slack: 2

  portable:
    name: portable gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2

      - name: Run the gate
        run: cargo xtask check --only portable

  coverage:
    name: coverage
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.native != 'false' && (github.event_name != 'pull_request' || github.base_ref == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CORE_LINE_COVERAGE_FLOOR: 76
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install WebKitGTK
        uses: ./.github/actions/apt-packages
        with:
          packages: libwebkit2gtk-4.1-dev

      - name: Install the pinned toolchain with the LLVM tools
        run: rustup toolchain install && rustup component add llvm-tools-preview

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest@0.9.146,cargo-llvm-cov@0.9.1

      - name: Measure the tests' coverage
        run: cargo llvm-cov nextest --workspace --all-features --locked --no-report

      - name: Report coverage
        run: |
          {
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hold the core crates to their coverage floor
        run: cargo llvm-cov report --summary-only --ignore-filename-regex '(^|/)(app|xtask)/' --fail-under-lines "$CORE_LINE_COVERAGE_FLOOR"

  fixtures:
    name: fixtures (${{ matrix.platform }})
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.base_ref == 'main') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-2025
    steps:
      - if: needs.changes.outputs.native != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: needs.changes.outputs.native != 'false'
        uses: ./.github/actions/fixtures-check
        with:
          platform: ${{ matrix.platform }}

  fixtures-macos:
    name: fixtures (macos)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.native != 'false' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'macos')) }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/fixtures-check
        with:
          platform: macos

  fixtures-agree:
    name: fixtures agree across platforms
    needs: [changes, fixtures, fixtures-macos]
    if: ${{ !cancelled() && needs.changes.outputs.native != 'false' && needs.fixtures.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.fixtures-macos.result) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fixtures-*
          merge-multiple: true

      - name: Compare the fixture hashes
        run: |
          status=0
          diff fixtures-linux.hashes fixtures-windows.hashes || status=1
          if [ -f fixtures-macos.hashes ]; then
            diff fixtures-linux.hashes fixtures-macos.hashes || status=1
          fi
          exit "$status"

  interface:
    name: interface gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install interface dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the test browser
        uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: xtask
          save-if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}

      - name: Run the gate
        run: cargo xtask check --only interface

  browser-build:
    name: browser test build
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.app != 'false' || needs.changes.outputs.site != 'false') }}
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: ${{ needs.changes.outputs.app != 'false' && 'pnpm' || '' }}

      - name: Share the browser tests out across shards
        id: shards
        env:
          IS_APP_CHANGED: ${{ needs.changes.outputs.app != 'false' }}
          IS_SITE_CHANGED: ${{ needs.changes.outputs.site != 'false' }}
          REST_SHARDS: 36
          SCREENS_SHARDS: 12
        run: |
          shards=$(jq -nc \
            --argjson isAppChanged "$IS_APP_CHANGED" \
            --argjson isSiteChanged "$IS_SITE_CHANGED" \
            --argjson rest "$REST_SHARDS" \
            --argjson screens "$SCREENS_SHARDS" \
            'def shards($group; $of): [range(1; $of + 1) | {group: $group, shard: ., of: $of}];
            (if $isAppChanged then shards("rest"; $rest) + shards("screens"; $screens) + shards("speed"; 1) else [] end)
            + (if $isSiteChanged then shards("site"; 1) else [] end)')
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

      - name: Install interface dependencies
        if: needs.changes.outputs.app != 'false'
        run: pnpm install --frozen-lockfile

      - name: Build the app the browser tests serve
        if: needs.changes.outputs.app != 'false'
        env:
          VITE_SAMPLE_LIBRARY: "on"
          VITE_KIT_PAGE: "on"
        run: pnpm --dir app build

      - name: List each group's tests
        if: needs.changes.outputs.app != 'false'
        working-directory: app
        run: |
          mkdir -p browser-test-lists
          for group in rest screens; do
            PLAYWRIGHT_GROUP=$group pnpm exec playwright test --list --reporter=json > "browser-test-lists/$group.json"
          done

      - name: Keep the build for the shards
        if: needs.changes.outputs.app != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            app/build/
            app/.svelte-kit/output/
            app/src/lib/paraglide/
            app/browser-test-lists/

  browser-packages:
    name: browser system packages
    needs: changes
    continue-on-error: true
    if: ${{ !cancelled() && (needs.changes.outputs.app != 'false' || needs.changes.outputs.site != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install interface dependencies
        run: pnpm install --frozen-lockfile

      - name: Name the test browsers' system packages
        id: browser-packages
        run: |
          playwright=$(pnpm --dir app exec playwright --version)
          digest=$(printf '%s %s' "$ImageOS" "$playwright" | sha256sum | cut -c1-16)
          echo "prefix=playwright-system-packages-$digest" >> "$GITHUB_OUTPUT"
          echo "key=playwright-system-packages-$digest-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore the test browsers' system packages
        id: restore-browser-packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/browser-packages
          key: ${{ steps.browser-packages.outputs.key }}
          restore-keys: ${{ steps.browser-packages.outputs.prefix }}

      - name: Download the test browsers' system packages once for every shard
        env:
          BROWSERS: chromium webkit
        run: |
          mkdir -p "$RUNNER_TEMP/browser-packages"
          if compgen -G "$RUNNER_TEMP/browser-packages/*.deb" > /dev/null; then
            sudo cp "$RUNNER_TEMP"/browser-packages/*.deb /var/cache/apt/archives/
          fi
          pnpm --dir app exec playwright install-deps $BROWSERS
          sudo apt-get autoclean
          rm -rf "$RUNNER_TEMP/browser-packages"
          mkdir -p "$RUNNER_TEMP/browser-packages"
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t "$RUNNER_TEMP/browser-packages" {} +
          echo "Kept $(find "$RUNNER_TEMP/browser-packages" -name '*.deb' | wc -l) system packages for the shards"

      - name: Keep the test browsers' system packages for later runs
        if: github.ref == 'refs/heads/main' && steps.restore-browser-packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/browser-packages
          key: ${{ steps.browser-packages.outputs.key }}

      - name: Hand the test browsers' system packages to the shards
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-system-packages
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
          path: ${{ runner.temp }}/browser-packages/

  browser:
    name: browser tests (${{ matrix.group }} ${{ matrix.shard }}/${{ matrix.of }})
    needs: [changes, browser-build, browser-packages]
    if: ${{ !cancelled() && needs.browser-build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.browser-build.outputs.shards) }}
    env:
      PLAYWRIGHT_GROUP: ${{ matrix.group }}
      OMNILEAF_APP_BUILT: "on"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install interface dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch the app's build
        if: matrix.group != 'site'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-test-build
          path: app

      - name: Fetch the test browsers' system packages
        if: needs.browser-packages.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-system-packages
          path: ${{ runner.temp }}/browser-packages

      - name: Put the test browsers' system packages back
        run: |
          if compgen -G "$RUNNER_TEMP/browser-packages/*.deb" > /dev/null; then
            sudo cp "$RUNNER_TEMP"/browser-packages/*.deb /var/cache/apt/archives/
          fi

      - name: Install the test browsers
        uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium webkit

      - name: Pick this shard's tests by how long they take
        if: matrix.group == 'rest' || matrix.group == 'screens'
        working-directory: app
        env:
          SHARD: ${{ matrix.shard }}/${{ matrix.of }}
        run: node tests/write-shard-test-list.ts "browser-test-lists/$PLAYWRIGHT_GROUP.json" "$SHARD" "$RUNNER_TEMP/shard-tests.txt"

      - name: Check that the test list runs exactly this shard's tests
        if: matrix.group == 'rest' || matrix.group == 'screens'
        working-directory: app
        env:
          SHARD: ${{ matrix.shard }}/${{ matrix.of }}
        run: |
          pnpm exec playwright test --list --reporter=json --test-list "$RUNNER_TEMP/shard-tests.txt" > "$RUNNER_TEMP/shard-tests.json"
          node tests/check-shard-test-list.ts "browser-test-lists/$PLAYWRIGHT_GROUP.json" "$SHARD" "$RUNNER_TEMP/shard-tests.json"

      - name: Run the app's browser tests
        if: matrix.group == 'rest' || matrix.group == 'screens'
        run: pnpm --dir app test:e2e --test-list "$RUNNER_TEMP/shard-tests.txt"

      - name: Time the interface on its own
        if: matrix.group == 'speed'
        run: env -u PLAYWRIGHT_GROUP pnpm --dir app test:e2e --project speed --no-deps

      - name: Run the website's browser tests
        if: matrix.group == 'site'
        run: pnpm --dir site test:e2e

      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-traces-${{ matrix.group }}-${{ matrix.shard }}
          path: |
            app/test-results/
            site/test-results/
          retention-days: 7

  browser-tests:
    name: browser tests
    needs: [browser-build, browser]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Pass only when the build and every shard passed, or none were needed
        env:
          RESULTS: ${{ needs.browser-build.result }}/${{ needs.browser.result }}
        run: test "$RESULTS" = success/success || test "$RESULTS" = skipped/skipped

  android:
    name: android
    if: github.event_name == 'push' || github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'mobile')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: ./.github/actions/android-ndk

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install interface dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the pinned toolchain with the emulator's Android target
        run: rustup toolchain install && rustup target add x86_64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}

      - name: Install Appium
        run: npm install --global appium@3.8.0 && appium driver install uiautomator2@8.7.0

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the slow Android specs nightly, or when a mobile pull request changes scheduled rescans
        id: slow-specs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          changed_scheduled_rescans() {
            changed=$(gh pr diff "$PULL_REQUEST" --repo "$GITHUB_REPOSITORY" --name-only) || return 0
            grep -qE '^(crates/omnileaf-engine/src/rescan|app/src-tauri/src/(scheduled_rescans|power_mode)\.rs|app/src-tauri/gen/android/app/src/main/java/app/omnileaf/PowerSavingPlugin\.kt|app/tests/app/[^/]+\.android\.slow\.e2e\.ts)' <<< "$changed"
          }
          if [ "$EVENT" = schedule ] || { [ "$EVENT" = pull_request ] && changed_scheduled_rescans; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test the app on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          RUN_SLOW_SPECS: ${{ steps.slow-specs.outputs.run }}
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          script: |
            cargo xtask check --only android
            if [ "$RUN_SLOW_SPECS" = true ]; then pnpm --dir app test:android:slow; fi

      - name: Keep the Appium log of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-appium-log
          path: app/test-results/
          retention-days: 7

  ios:
    name: ios
    if: github.event_name == 'push' || github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'mobile')
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install interface dependencies
        run: pnpm install --frozen-lockfile

      - name: Start booting an iPhone Simulator matching Xcode's SDK
        run: |
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          runtime=$(xcrun simctl list runtimes --json | jq -r --arg sdk "$sdk" 'first(.runtimes[] | select(.platform == "iOS" and .isAvailable and .version == $sdk)) | .identifier')
          udid=$(xcrun simctl list devices available --json | jq -r --arg runtime "$runtime" '.devices[$runtime] | map(select(.name | startswith("iPhone"))) | first | .udid')
          nohup xcrun simctl boot "$udid" > "$RUNNER_TEMP/simulator-boot.log" 2>&1 &
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Install the pinned toolchain with the iOS targets
        run: rustup toolchain install && rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}

      - name: Install Appium
        run: npm install --global appium@3.8.0 && appium driver install xcuitest@12.13.2

      - name: Download the prebuilt WebDriverAgent for the Simulator
        run: |
          appium driver run xcuitest download-wda -- --outdir "$RUNNER_TEMP/wda" --platform iOS --kind sim
          wda=$(find "$RUNNER_TEMP/wda" -maxdepth 6 -name WebDriverAgentRunner-Runner.app | head -n 1)
          test -n "$wda"
          echo "OMNILEAF_PREBUILT_WDA=$wda" >> "$GITHUB_ENV"

      - name: Wait for the Simulator to finish booting
        run: xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Build and test the app on the Simulator
        run: cargo xtask check --only ios

      - name: Keep the Appium log of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-appium-log
          path: app/test-results/
          retention-days: 7

  app:
    name: app (${{ matrix.platform }})
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.base_ref == 'main') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-2025
    steps:
      - if: (needs.changes.outputs.native != 'false' || needs.changes.outputs.app != 'false')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: (needs.changes.outputs.native != 'false' || needs.changes.outputs.app != 'false')
        uses: ./.github/actions/app-gate

  app-macos:
    name: app (macos)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.native != 'false' || needs.changes.outputs.app != 'false') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'macos')) }}
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/app-gate

  prune-caches:
    name: prune caches
    needs: [rust, rust-windows, rust-macos, portable, coverage, fixtures, fixtures-macos, interface, browser, android, ios, app, app-macos]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CACHE_BUDGET_GB: 18
    steps:
      - name: Keep main's and each open pull request's newest caches within the budget
        shell: bash
        run: |
          budget=$((CACHE_BUDGET_GB * 1024 * 1024 * 1024))
          open=$(gh api --paginate "repos/$GH_REPO/pulls?state=open&per_page=100" --jq '.[].number' | jq -s -c .)
          gh api --paginate "repos/$GH_REPO/actions/caches?per_page=100" --jq '.actions_caches[]' \
            | jq -s -r --argjson open "$open" --argjson budget "$budget" '
                [.[] | .family = (.key | sub("(-[0-9a-f]{8,}|-[0-9]{4}-W[0-9]{2})$"; ""))
                     | .pr = ((.ref | capture("^refs/pull/(?<n>[0-9]+)/merge$") | .n | tonumber) // null)]
                | (map(select(.ref == "refs/heads/main")) | group_by(.family) | map(max_by(.created_at))) as $main
                | (map(select(.pr != null and (.pr | IN($open[])))) | group_by([.ref, .family]) | map(max_by(.created_at))) as $prs
                | (reduce ($prs | sort_by(.last_accessed_at))[] as $cache
                    ({total: ($main + $prs | map(.size_in_bytes) | add // 0), evicted: []};
                     if .total > $budget then .total -= $cache.size_in_bytes | .evicted += [$cache.id] else . end)
                  ) as $fitted
                | ($main + $prs | map(.id) - $fitted.evicted) as $kept
                | .[] | select(.id | IN($kept[]) | not) | .id' \
            | while read -r id; do
                if failure=$(gh api -X DELETE "repos/$GH_REPO/actions/caches/$id" --silent 2>&1); then
                  echo "Deleted cache $id"
                elif grep -q "HTTP 404" <<< "$failure"; then
                  echo "Cache $id was already gone"
                else
                  echo "$failure" >&2
                  exit 1
                fi
              done
          used=$(gh api "repos/$GH_REPO/actions/cache/usage" --jq .active_caches_size_in_bytes)
          echo "Caches now hold $((used / 1048576)) MB"
          if [ "$used" -gt "$budget" ]; then
            echo "::warning::Main's newest caches alone hold $((used / 1048576)) MB, over the ${CACHE_BUDGET_GB} GB budget"
          fi
