name: fuzz

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz the archive and ComicInfo readers
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FUZZ_SECONDS: 900
      INPUT_TIMEOUT_SECONDS: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain and the fuzzing nightly
        run: rustup toolchain install && (cd fuzz && rustup toolchain install)

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            fuzz -> target

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz@0.13.2 --locked

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Write the seed inputs
        run: cargo xtask fuzz-seeds

      - name: Fuzz each target for its share of the time
        working-directory: fuzz
        run: |
          mapfile -t targets < <(cargo fuzz list)
          share=$((FUZZ_SECONDS / ${#targets[@]}))
          status=0
          for target in "${targets[@]}"; do
            cargo fuzz run "$target" -- -max_total_time="$share" -timeout="$INPUT_TIMEOUT_SECONDS" || status=1
          done
          exit "$status"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() || cancelled()
        with:
          name: fuzz-crashes
          if-no-files-found: ignore
          retention-days: 14
          path: fuzz/artifacts/
