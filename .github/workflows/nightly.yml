name: nightly

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/nightly.yml

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: desktop bundles (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            bundles: deb,appimage
          - platform: macos
            runner: macos-15
            bundles: dmg
          - platform: windows
            runner: windows-2025
            bundles: nsis,msi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install WebKitGTK and the AppImage tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev patchelf file

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install interface dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the unsigned bundles
        run: pnpm --dir app tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 3
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

  android:
    name: android debug apk
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NDK_VERSION: 27.1.12297006
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install the Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install interface dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the pinned toolchain with the Android target
        run: rustup toolchain install && rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the ARM debug APK
        run: pnpm --dir app tauri android build --debug --apk --target aarch64

      - name: Name the APK
        run: |
          apk=$(find app/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          test -n "$apk"
          cp "$apk" "$RUNNER_TEMP/omnileaf-nightly-android-arm64-debug.apk"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-android
          if-no-files-found: error
          retention-days: 3
          path: ${{ runner.temp }}/omnileaf-nightly-android-arm64-debug.apk

  ios:
    name: ios simulator app
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install interface dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the pinned toolchain with the Simulator target
        run: rustup toolchain install && rustup target add aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the Simulator app
        run: pnpm --dir app tauri ios build --debug --target aarch64-sim --no-sign

      - name: Zip the app
        run: |
          app=$(find app/src-tauri/gen/apple/build -name '*.app' -type d | head -n 1)
          test -n "$app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/omnileaf-nightly-ios-simulator.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-ios
          if-no-files-found: error
          retention-days: 3
          path: ${{ runner.temp }}/omnileaf-nightly-ios-simulator.zip

  publish:
    name: publish the nightly pre-release
    needs: [desktop, android, ios]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nightly-*
          merge-multiple: true
          path: nightly

      - name: Replace the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          mapfile -t builds < <(find nightly -type f | LC_ALL=C sort)
          if gh release view nightly > /dev/null 2>&1; then
            gh release delete nightly --cleanup-tag --yes
          fi
          gh release create nightly "${builds[@]}" \
            --prerelease \
            --latest=false \
            --target "$SHA" \
            --title "Nightly" \
            --notes "Unsigned builds of \`main\` at ${SHA::7}, for testing only. Desktop installers aren't signed, so the system warns before opening them. The iOS build runs only in the Simulator."
