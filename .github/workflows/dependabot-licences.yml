name: dependabot licences

on:
  pull_request:
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - about.toml
      - pnpm-lock.yaml
      - "**/package.json"

permissions:
  contents: read

concurrency:
  group: dependabot-licences-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: regenerate the licence catalogues
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install interface dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: xtask
          save-if: false

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@0.9.2

      - name: Regenerate the licence catalogues
        run: cargo xtask licences

      - name: Compare them with the pull request's
        id: compare
        run: |
          if git diff --quiet -- app/src/lib/licences; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Hand the new catalogues to the commit job
        if: steps.compare.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licence-catalogues
          path: |
            app/src/lib/licences/rust.json
            app/src/lib/licences/javascript.json
          retention-days: 1

  commit:
    name: commit the licence catalogues
    needs: regenerate
    if: needs.regenerate.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Get a token that starts CI on its commit
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.DEPENDABOT_LICENCES_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_LICENCES_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: licence-catalogues
          path: catalogues

      - name: Check the catalogues are JSON
        run: jq empty catalogues/rust.json catalogues/javascript.json

      - name: Commit them onto the pull request, unless it has moved on
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base64 -w0 catalogues/rust.json > rust.b64
          base64 -w0 catalogues/javascript.json > javascript.b64
          jq -n \
            --arg repository "$REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg head "$HEAD_SHA" \
            --rawfile rust rust.b64 \
            --rawfile javascript javascript.b64 \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repository, branchName: $branch},
                expectedHeadOid: $head,
                message: {headline: "chore(licences): regenerate the licence catalogues"},
                fileChanges: {additions: [
                  {path: "app/src/lib/licences/rust.json", contents: $rust},
                  {path: "app/src/lib/licences/javascript.json", contents: $javascript}
                ]}
              }}
            }' > commit.json
          gh api graphql --input commit.json
