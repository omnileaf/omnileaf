name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0

jobs:
  version:
    name: read the version from the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$ ]]; then
            echo "::error::$TAG isn't v followed by a semantic version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  desktop:
    name: desktop installers (${{ matrix.platform }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            bundles: deb,appimage
          - platform: macos
            runner: macos-15
            bundles: dmg
            targets: aarch64-apple-darwin x86_64-apple-darwin
            build-args: --target universal-apple-darwin
          - platform: windows
            runner: windows-2025
            bundles: nsis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stamp the version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: perl -pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/' Cargo.toml

      - name: Install WebKitGTK and the AppImage tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev patchelf file

      - name: Use the Apple signing secrets
        if: runner.os == 'macOS'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [[ -z "$CERTIFICATE" ]]; then
            echo "::warning::The Apple signing secrets aren't set, so the macOS app is neither signed nor notarized"
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$(printf '%s' "$CERTIFICATE" | tr -d '\r\n')"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
          if [[ -z "$API_KEY_P8" ]]; then
            echo "::warning::The App Store Connect key isn't set, so the macOS app is signed but not notarized"
            exit 0
          fi
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$API_KEY_P8" > "$key_path"
          {
            echo "APPLE_API_ISSUER=$API_ISSUER"
            echo "APPLE_API_KEY=$API_KEY"
            echo "APPLE_API_KEY_PATH=$key_path"
          } >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install interface dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the pinned toolchain
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
        run: rustup toolchain install && if [[ -n "$TARGETS" ]]; then rustup target add $TARGETS; fi

      - name: Build the installers
        run: pnpm --dir app tauri build --bundles ${{ matrix.bundles }} ${{ matrix.build-args }}

      - name: Gather the installers
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/installers"
          find target -path '*/release/bundle/*' \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*-setup.exe' \) \
            -exec cp {} "$RUNNER_TEMP/installers/" \;
          test -n "$(ls -A "$RUNNER_TEMP/installers")"

      - id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ runner.os == 'Windows' && 'unsigned-windows' || format('release-{0}', matrix.platform) }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/installers/*

      - name: Check for SignPath
        id: signpath
        if: runner.os == 'Windows'
        shell: bash
        env:
          API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [[ -z "$API_TOKEN" ]]; then
            echo "::warning::SIGNPATH_API_TOKEN isn't set, so the Windows installer isn't signed"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign the Windows installer
        if: steps.signpath.outputs.configured == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          output-artifact-directory: ${{ runner.temp }}/signed

      - name: Use the unsigned Windows installer
        if: steps.signpath.outputs.configured == 'false'
        shell: bash
        run: cp -r "$RUNNER_TEMP/installers" "$RUNNER_TEMP/signed"

      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/signed/*

  android:
    name: android apk
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the release keystore
        id: keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE" ]]; then
            echo "::warning::ANDROID_KEYSTORE isn't set, so the release has no Android APK"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE" | base64 --decode > "$keystore"
          {
            echo "ANDROID_KEYSTORE_PATH=$keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Stamp the version
        if: steps.keystore.outputs.configured == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: perl -pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/' Cargo.toml

      - if: steps.keystore.outputs.configured == 'true'
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - if: steps.keystore.outputs.configured == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - if: steps.keystore.outputs.configured == 'true'
        uses: ./.github/actions/android-ndk

      - if: steps.keystore.outputs.configured == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - if: steps.keystore.outputs.configured == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install interface dependencies
        if: steps.keystore.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install the pinned toolchain with the Android targets
        if: steps.keystore.outputs.configured == 'true'
        run: rustup toolchain install && rustup target add aarch64-linux-android armv7-linux-androideabi

      - name: Build the signed APK
        if: steps.keystore.outputs.configured == 'true'
        run: pnpm --dir app tauri android build --apk --target aarch64 armv7

      - name: Name the APK
        if: steps.keystore.outputs.configured == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          apk=app/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          test -f "$apk"
          mkdir -p "$RUNNER_TEMP/apk"
          cp "$apk" "$RUNNER_TEMP/apk/omnileaf-$VERSION-android.apk"

      - if: steps.keystore.outputs.configured == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/apk/*

  publish:
    name: draft the release
    needs: [version, desktop, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          cd release
          sha256sum -- * > SHA256SUMS
          mapfile -t files < <(find . -maxdepth 1 -type f | LC_ALL=C sort)
          flags=(--draft --verify-tag --generate-notes --title "Omnileaf $VERSION")
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" "${files[@]}" "${flags[@]}"
