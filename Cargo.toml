[workspace]
resolver = "3"
members = ["app/src-tauri", "crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
repository = "https://github.com/omnileaf/omnileaf"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
local-ip-address = "0.6.13"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
omnileaf-engine = { path = "crates/omnileaf-engine" }
omnileaf-formats = { path = "crates/omnileaf-formats" }
omnileaf-testkit = { path = "crates/omnileaf-testkit" }
png = "0.18.1"
proptest = "1.11.0"
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri = "2.12.0"
tauri-build = "2.7.0"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-wdio-webdriver = "1.4.0"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-normalization = "0.1.25"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
