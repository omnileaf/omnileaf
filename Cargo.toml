[workspace]
resolver = "3"
members = ["app/src-tauri", "crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
repository = "https://github.com/omnileaf/omnileaf"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
blake3 = { version = "1.8.7", default-features = false, features = ["pure"] }
clap = { version = "4.6.7", features = ["derive"] }
local-ip-address = "0.6.13"
fast_image_resize = { version = "6.1.0", default-features = false, features = ["std"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
icu_casemap = "=2.3.0"
icu_collator = "=2.3.1"
icu_locale_core = { version = "=2.3.0", features = ["alloc"] }
icu_provider = { version = "=2.3.1", default-features = false }
image-webp = "0.2.4"
jpeg-decoder = { version = "0.3.2", default-features = false }
jpeg-encoder = { version = "0.7.1", default-features = false, features = ["std"] }
omnileaf-db = { path = "crates/omnileaf-db" }
omnileaf-engine = { path = "crates/omnileaf-engine" }
omnileaf-formats = { path = "crates/omnileaf-formats" }
omnileaf-imaging = { path = "crates/omnileaf-imaging" }
omnileaf-sync-proto = { path = "crates/omnileaf-sync-proto" }
omnileaf-testkit = { path = "crates/omnileaf-testkit" }
png = "0.18.1"
proptest = "1.11.0"
quick-xml = "0.42.0"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri = "2.12.0"
tauri-build = "2.7.0"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-wdio-webdriver = "1.4.0"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", default-features = false }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-normalization = "0.1.25"
uuid = { version = "1.26.1", default-features = false, features = ["v8"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
