[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained but compile-time only, pulled in by Tauri 2's GTK3 bindings on Linux; drop this once Tauri uses GTK4" },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained but compile-time only, pulled in by specta's macros for the typed command bindings; drop this once specta no longer uses it" },
]

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "IJG",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "unrar", reason = "UnRAR's licence is incompatible with the GPL" },
    { crate = "unrar_sys", reason = "UnRAR's licence is incompatible with the GPL" },
    { crate = "unrar-rs", reason = "UnRAR's licence is incompatible with the GPL" },
    { crate = "unrar-ng", reason = "UnRAR's licence is incompatible with the GPL" },
    { crate = "openssl-sys", reason = "rustls is the only TLS stack" },
    { crate = "native-tls", reason = "rustls is the only TLS stack" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
